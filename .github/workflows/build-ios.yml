name: Build iOS IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Verify iOS 18 SDK
        run: |
          xcodebuild -showsdks | grep -E 'iphoneos18(\.|$)'

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project PokeTool.xcodeproj \
            -scheme PokeTool \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$BUILD_STATUS" -ne 0 ]]; then
            grep -E '(^| )error:|:[0-9]+:[0-9]+: error:' "$RUNNER_TEMP/simulator-build.log" \
              | tail -30 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit "$BUILD_STATUS"
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project PokeTool.xcodeproj \
            -scheme PokeTool \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Archive unsigned application
        run: |
          set -o pipefail
          xcodebuild \
            -project PokeTool.xcodeproj \
            -scheme PokeTool \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PokeTool.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$RUNNER_TEMP/PokeTool.xcarchive/Products/Applications/PokeTool.app" \
            "$RUNNER_TEMP/unsigned/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/unsigned/Payload" \
            "$RUNNER_TEMP/PokeTool-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PokeTool-unsigned
          path: ${{ runner.temp }}/PokeTool-unsigned.ipa
          if-no-files-found: error

      - name: Detect signing secrets
        id: signing
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$CERTIFICATE" && -n "$PROFILE" && -n "$IDENTITY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing assets
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Sign and package IPA
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
        run: |
          SIGNED_ROOT="$RUNNER_TEMP/signed"
          APP_PATH="$SIGNED_ROOT/Payload/PokeTool.app"
          mkdir -p "$SIGNED_ROOT/Payload"
          cp -R "$RUNNER_TEMP/PokeTool.xcarchive/Products/Applications/PokeTool.app" "$APP_PATH"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP_PATH/embedded.mobileprovision"

          /usr/libexec/PlistBuddy -x \
            -c "Print :Entitlements" \
            "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp=none \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent \
            "$SIGNED_ROOT/Payload" \
            "$RUNNER_TEMP/PokeTool-signed.ipa"

      - name: Upload signed IPA
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PokeTool-signed
          path: ${{ runner.temp }}/PokeTool-signed.ipa
          if-no-files-found: error
